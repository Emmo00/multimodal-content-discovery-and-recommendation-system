<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IntelliVerse</title>
  <link rel="stylesheet" href="/static/user/styles.css">
</head>
<body>
  <header class="pill-nav">
    <a class="wordmark" href="/">IntelliVerse</a>
    <nav aria-label="User navigation">
      <button class="nav-link active" data-view="discover">Discover</button>
      <button class="nav-link" data-view="profile">Profile</button>
    </nav>
    <span id="user-chip" class="muted">Guest</span>
  </header>

  <main id="app" class="shell" aria-live="polite"></main>
  <div id="toast" class="toast" role="status"></div>
  <div id="watch-modal" class="watch-modal" hidden>
    <div class="watch-dialog" role="dialog" aria-modal="true" aria-labelledby="watch-title">
      <div class="watch-header">
        <h2 id="watch-title">Watch video</h2>
        <button id="watch-close" class="watch-close" type="button" aria-label="Close video">Close</button>
      </div>
      <div class="video-frame">
        <iframe
          id="watch-frame"
          title="YouTube video player"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      </div>
    </div>
  </div>
  <script src="/static/user/app.js" defer></script>
</body>
</html>
